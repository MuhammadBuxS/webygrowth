# Publishes scheduled blog posts.
#
# Posts with a future `pubDate` are excluded from the build until that date passes,
# so the site needs a rebuild each morning for them to appear. This workflow pings a
# Cloudflare Pages Deploy Hook daily.
#
# Setup (once):
#   1. Cloudflare Pages -> webygrowth -> Settings -> Builds & deployments -> Deploy hooks
#      -> Add deploy hook (name: "daily-publish", branch: main) -> copy the URL.
#      It looks like:
#      https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/<long-id>
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#      -> Name: CLOUDFLARE_DEPLOY_HOOK  Value: that URL, with no quotes and no spaces.
name: Scheduled publish

on:
  schedule:
    - cron: '10 7 * * *' # 07:10 UTC daily
  workflow_dispatch: # also runnable by hand from the Actions tab

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          set -u
          # Strip whitespace, newlines and any quotes that were pasted with the value.
          url="$(printf '%s' "$HOOK" | tr -d '[:space:]' | tr -d '"'"'"'')"

          if [ -z "$url" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK is not set — nothing to trigger."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi

          case "$url" in
            https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/*) ;;
            *)
              echo "::error::CLOUDFLARE_DEPLOY_HOOK does not look like a Cloudflare deploy hook URL."
              echo "Expected it to start with:"
              echo "  https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/"
              echo "Value length: ${#url} characters. Re-copy the URL from Cloudflare Pages"
              echo "(Settings > Builds & deployments > Deploy hooks) and update the secret."
              exit 1
              ;;
          esac

          code="$(curl -sS -o /tmp/hook-response.json -w '%{http_code}' -X POST "$url")"
          echo "Cloudflare responded with HTTP $code"
          cat /tmp/hook-response.json || true
          echo

          if [ "$code" != "200" ]; then
            echo "::error::Deploy hook call failed (HTTP $code). The hook may have been deleted or regenerated in Cloudflare."
            exit 1
          fi

          echo "Build triggered. Any post dated today will be live in a few minutes."
